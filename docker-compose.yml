services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: salesflow
      POSTGRES_PASSWORD: salesflow
      POSTGRES_DB: salesflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesflow -d salesflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: S3-compatible storage for attachments (any compatible image works)
  # minio:
  #   image: quay.io/minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
